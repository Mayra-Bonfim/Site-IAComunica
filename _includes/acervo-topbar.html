  <header class="acervo-topbar">
    <div class="acervo-topbar__inner">
      <div class="acervo-topbar__brand">
        <a href="/" class="acervo-topbar__site" aria-label="Voltar para o site institucional IA Comunica">
          <svg class="acervo-topbar__site-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          IA Comunica
        </a>
        <span class="acervo-topbar__sep" aria-hidden="true">/</span>
        <a href="/acervo/" class="acervo-topbar__acervo">Acervo</a>
      </div>
      <div class="acervo-search">
        <span class="acervo-search__icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4" />
            <path d="M11.5 11.5 15 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </span>
        <input type="search" class="acervo-search__input" placeholder="Buscar por ferramenta, problema..." aria-label="Buscar no Acervo" autocomplete="off" />
        <div class="acervo-search__results" role="listbox"></div>
      </div>
      <button type="button" class="acervo-theme-toggle" data-theme-toggle aria-label="Ativar modo claro" aria-pressed="false">
        <svg class="acervo-theme-toggle__icon acervo-theme-toggle__icon--sun" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="3.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 1v1.5M8 13.5V15M15 8h-1.5M2.5 8H1M12.7 3.3l-1 1M4.3 11.7l-1 1M12.7 12.7l-1-1M4.3 4.3l-1-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <svg class="acervo-theme-toggle__icon acervo-theme-toggle__icon--moon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13.5 9.3A5.8 5.8 0 0 1 6.7 2.5a5.8 5.8 0 1 0 6.8 6.8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>
