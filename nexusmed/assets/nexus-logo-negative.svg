<svg width="280" height="80" viewBox="0 0 280 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Use on dark backgrounds -->
  <defs>
    <linearGradient id="seam_neg" x1="0" y1="10" x2="0" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C4ED8"/>
      <stop offset="100%" stop-color="#00C2AE"/>
    </linearGradient>
    <clipPath id="left_neg"><rect x="0" y="0" width="32" height="80"/></clipPath>
    <clipPath id="right_neg"><rect x="32" y="0" width="32" height="80"/></clipPath>
  </defs>
  <path d="M6,70 L6,10 L58,70 L58,10"
