  <line x1="32" y1="12" x2="32" y2="68" stroke="url(#seam_neg)" stroke-width="1.5" opacity="0.55"/>
  <circle cx="32" cy="40" r="3.5" fill="url(#seam_neg)" opacity="0.95"/>
  <text x="80" y="50"
        font-family="'Space Grotesk', -apple-system, sans-serif"
